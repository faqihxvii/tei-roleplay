services:
  - type: web
    runtime: node
    name: tei-roleplay
    plan: free
    repo: https://github.com/faqihxvii/tei-roleplay
    branch: ccr-4bc99e3c-hjd9h2
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
