services:
  - type: web
    runtime: node
    name: tei-roleplay
    plan: free
    repo: https://github.com/faqihxvii/tei-roleplay
    branch: main
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      # Optional: free-plan disks are wiped on restart, so post session reports somewhere durable,
      # e.g. the Google Sheets receiver in tools/sheets-telemetry (room/README.md).
      - key: TELEMETRY_WEBHOOK_URL
        sync: false
      - key: TELEMETRY_TOKEN
        sync: false
